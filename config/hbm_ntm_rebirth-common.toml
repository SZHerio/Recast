#Recast: единая радиационная модель принадлежит NuclearCraft.
#
#Решение владельца от 3 августа 2026. У сборки один счётчик дозы, одна шкала и
#одна аптечка: NuclearCraft считает фон, распад, экранирование бронёй и
#дезактивацию (config/NuclearCraft/radiation.toml). Собственная радиационная
#модель HBM выключена здесь, чтобы два мода не показывали разные числа про одно
#и то же место.
#
#Выключено ровно четыре переключателя. Остальные значения секций radiation,
#pollution и hazards оставлены модовыми: Forge допишет их сам при первом
#запуске, и это осознанно — сборка правит только то, что действительно
#пересекается с уже назначенным владельцем.
#
#Загрязнение HBM выключено по тому же правилу «одна роль — один владелец»:
#экологией сборки владеют Pollution of the Realms и Advanced Chimneys, принятые
#в M4. Это отдельное следствие того же принципа, а не часть решения о радиации,
#и откатывается одной строкой.
#
#Имена и вложенность ключей не угаданы, а прочитаны из байткода JAR 0.4.1beta.
#В com/hbm/ntm/config/HbmCommonConfig все вызовы push и pop сбалансированы до
#вызова RadiationConfig.define(builder): глубина стека секций в этот момент
#равна нулю. Значит radiation, pollution и hazards — секции верхнего уровня, а
#не вложенные. Внутри RadiationConfig порядок тот же: push("radiation") с
#пятнадцатью ключами, push("pollution") с двадцатью, push("hazards") с семью.
#Проверено дизассемблированием, а не порядком строк в пуле констант.

[radiation]
	#Заражение сущностей радиацией HBM. Дозу игрока считает NuclearCraft.
	enableContamination = false
	#Чанковая радиация HBM. Вторая карта заражения местности не заводится.
	enableChunkRads = false
	#Радиация кратера после ядерного взрыва. Следствие того же единого счётчика:
	#без чанковой радиации кратер остаётся воронкой, а не второй шкалой дозы.
	enableCraterBiomeRadiation = false

[pollution]
	#Сажа, яд, тяжёлые металлы и осадки HBM. Владелец экологии — Pollution of the Realms.
	enablePollution = false
